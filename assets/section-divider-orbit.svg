<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 120" role="img" aria-labelledby="title desc">
  <title id="title">Avivly Section Divider</title>
  <desc id="desc">Animated orbit divider with lab-style nodes and a subtle signal wave for GitHub profile sections.</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#111111" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.08" />
    </linearGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <radialGradient id="nodeA" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7a45" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#ff7a45" stop-opacity="0.16" />
    </radialGradient>
    <radialGradient id="nodeB" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1ea896" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#1ea896" stop-opacity="0.16" />
    </radialGradient>
    <radialGradient id="nodeC" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffd84d" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffd84d" stop-opacity="0.18" />
    </radialGradient>
  </defs>

  <rect width="1600" height="120" fill="none" />
  <path d="M88 60 H1512" stroke="url(#line)" stroke-width="1.2" stroke-dasharray="9 14" />
  <path d="M88 60 C250 18, 390 18, 520 60 S800 102, 980 60 S1240 18, 1512 60" fill="none" stroke="#111111" stroke-opacity="0.11" stroke-width="2" stroke-linecap="round">
    <animate attributeName="d" values="M88 60 C250 18, 390 18, 520 60 S800 102, 980 60 S1240 18, 1512 60;M88 60 C250 98, 390 98, 520 60 S800 22, 980 60 S1240 98, 1512 60;M88 60 C250 18, 390 18, 520 60 S800 102, 980 60 S1240 18, 1512 60" dur="7s" repeatCount="indefinite" />
  </path>

  <g>
    <circle cx="270" cy="60" r="10" fill="url(#nodeA)">
      <animate attributeName="r" values="9;12;9" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="800" cy="60" r="10" fill="url(#nodeB)">
      <animate attributeName="r" values="9;12;9" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1330" cy="60" r="10" fill="url(#nodeC)">
      <animate attributeName="r" values="9;12;9" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="570" cy="60" r="5" fill="#111111" fill-opacity="0.46" />
    <circle cx="1030" cy="60" r="5" fill="#111111" fill-opacity="0.46" />
    <path d="M270 60 L570 60 L800 60 L1030 60 L1330 60" stroke="#111111" stroke-opacity="0.16" stroke-width="1.4" stroke-dasharray="6 8" />
  </g>

  <g transform="translate(730,18)">
    <circle cx="70" cy="42" r="26" fill="#ffd84d" fill-opacity="0.2" filter="url(#softBlur)">
      <animate attributeName="r" values="24;30;24" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="70" cy="42" r="14" fill="#ff7a45" fill-opacity="0.36" filter="url(#softBlur)">
      <animate attributeName="cx" values="66;74;66" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="70" cy="42" r="8" fill="#111111" fill-opacity="0.56" />
    <path d="M70 4 V80" stroke="#111111" stroke-opacity="0.14" stroke-width="1.1" stroke-dasharray="5 7" />
  </g>
</svg>
