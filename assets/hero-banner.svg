<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Avivly GitHub Profile Hero Banner</title>
  <desc id="desc">Animated futuristic agent lab banner with warm editorial tones, orbiting nodes, and a featured latest build panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf4ea" />
      <stop offset="48%" stop-color="#f4e7d5" />
      <stop offset="100%" stop-color="#f7efe4" />
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ff7a45" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#ff7a45" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#ff7a45" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowB" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1ea896" stop-opacity="0.95" />
      <stop offset="58%" stop-color="#1ea896" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#1ea896" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffd84d" stop-opacity="1" />
      <stop offset="65%" stop-color="#ffd84d" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffd84d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#fff9f1" stop-opacity="0.97" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#111111" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0.08" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5e4a39" flood-opacity="0.18" />
    </filter>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <clipPath id="rounded">
      <rect x="0" y="0" width="1600" height="520" rx="34" ry="34" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1600" height="520" fill="url(#bg)" />

    <g opacity="0.9">
      <circle cx="1260" cy="98" r="180" fill="url(#glowC)" filter="url(#softBlur)">
        <animate attributeName="cx" values="1240;1280;1240" dur="10s" repeatCount="indefinite" />
        <animate attributeName="cy" values="88;108;88" dur="10s" repeatCount="indefinite" />
      </circle>
      <circle cx="1300" cy="376" r="160" fill="url(#glowB)" filter="url(#softBlur)">
        <animate attributeName="cx" values="1280;1320;1280" dur="12s" repeatCount="indefinite" />
        <animate attributeName="cy" values="360;392;360" dur="12s" repeatCount="indefinite" />
      </circle>
      <circle cx="230" cy="108" r="130" fill="url(#glowA)" filter="url(#softBlur)">
        <animate attributeName="cx" values="212;244;212" dur="9s" repeatCount="indefinite" />
        <animate attributeName="cy" values="96;118;96" dur="9s" repeatCount="indefinite" />
      </circle>
    </g>

    <g opacity="0.32">
      <path d="M120 110 H1480" stroke="url(#line)" stroke-width="1" stroke-dasharray="8 12" />
      <path d="M120 220 H1480" stroke="url(#line)" stroke-width="1" stroke-dasharray="8 12" />
      <path d="M120 330 H1480" stroke="url(#line)" stroke-width="1" stroke-dasharray="8 12" />
      <path d="M120 440 H1480" stroke="url(#line)" stroke-width="1" stroke-dasharray="8 12" />
    </g>

    <g opacity="0.18">
      <circle cx="270" cy="340" r="118" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="4 12" />
      <circle cx="270" cy="340" r="72" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="4 12" />
      <circle cx="1218" cy="196" r="145" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="4 12" />
    </g>

    <g transform="translate(116,88)">
      <text x="0" y="0" fill="#111111" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" letter-spacing="0.22em" font-weight="700">AVIVLY / AGENT LAB</text>
      <text x="0" y="90" fill="#111111" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="400" letter-spacing="-0.04em">Creative systems</text>
      <text x="0" y="166" fill="#111111" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-weight="400" letter-spacing="-0.04em">with real product value</text>
      <text x="2" y="216" fill="#5e5a55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Healthcare AI, evidence tooling, and experimental interfaces.</text>

      <g transform="translate(0,260)">
        <rect x="0" y="0" width="170" height="52" rx="18" fill="#111111" opacity="0.94" />
        <text x="85" y="33" text-anchor="middle" fill="#fff9f1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Latest Creation</text>
        <rect x="184" y="0" width="160" height="52" rx="18" fill="#ffffff" opacity="0.72" stroke="#111111" stroke-opacity="0.14" />
        <text x="264" y="33" text-anchor="middle" fill="#111111" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Latest Update</text>
        <rect x="358" y="0" width="180" height="52" rx="18" fill="#ffffff" opacity="0.72" stroke="#111111" stroke-opacity="0.14" />
        <text x="448" y="33" text-anchor="middle" fill="#111111" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Recent Signal</text>
      </g>
    </g>

    <g transform="translate(610,90)">
      <circle cx="170" cy="150" r="162" fill="url(#glowC)" filter="url(#softBlur)">
        <animate attributeName="r" values="150;170;150" dur="8s" repeatCount="indefinite" />
      </circle>
      <circle cx="170" cy="150" r="104" fill="url(#glowB)" filter="url(#softBlur)">
        <animate attributeName="cx" values="160;180;160" dur="9s" repeatCount="indefinite" />
      </circle>
      <circle cx="170" cy="150" r="70" fill="url(#glowA)" filter="url(#softBlur)">
        <animate attributeName="cy" values="142;158;142" dur="6s" repeatCount="indefinite" />
      </circle>
      <circle cx="170" cy="150" r="126" fill="none" stroke="#111111" stroke-opacity="0.18" stroke-width="1.4" stroke-dasharray="7 11">
        <animateTransform attributeName="transform" type="rotate" values="0 170 150;360 170 150" dur="28s" repeatCount="indefinite" />
      </circle>
      <circle cx="170" cy="150" r="92" fill="none" stroke="#111111" stroke-opacity="0.14" stroke-width="1.2" stroke-dasharray="4 10">
        <animateTransform attributeName="transform" type="rotate" values="360 170 150;0 170 150" dur="18s" repeatCount="indefinite" />
      </circle>

      <g filter="url(#shadow)">
        <rect x="46" y="82" width="248" height="136" rx="26" fill="url(#card)" stroke="#111111" stroke-opacity="0.12" />
        <text x="68" y="116" fill="#111111" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="0.16em">INTELLIGENCE APPLIED</text>
        <text x="68" y="152" fill="#111111" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="400" letter-spacing="-0.03em">Latest creation</text>
        <text x="68" y="182" fill="#5e5a55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Manual curation, live value, crisp motion.</text>
        <rect x="68" y="194" width="84" height="10" rx="5" fill="#1ea896" opacity="0.9" />
        <rect x="160" y="194" width="110" height="10" rx="5" fill="#ff7a45" opacity="0.88" />
      </g>
    </g>

    <g transform="translate(1184,108)" filter="url(#shadow)">
      <rect x="0" y="0" width="270" height="286" rx="30" fill="url(#card)" stroke="#111111" stroke-opacity="0.12" />
      <text x="28" y="38" fill="#111111" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="0.16em">BENCHMARK CARDS</text>

      <g transform="translate(24,60)">
        <rect x="0" y="0" width="222" height="56" rx="18" fill="#f8f0e7" stroke="#111111" stroke-opacity="0.10" />
        <circle cx="28" cy="28" r="10" fill="#ff7a45" />
        <text x="52" y="24" fill="#111111" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Latest update</text>
        <text x="52" y="42" fill="#5e5a55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">meaningful, not noisy</text>
      </g>

      <g transform="translate(24,126)">
        <rect x="0" y="0" width="222" height="56" rx="18" fill="#fff2dc" stroke="#111111" stroke-opacity="0.10" />
        <circle cx="28" cy="28" r="10" fill="#1ea896" />
        <text x="52" y="24" fill="#111111" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Latest creation</text>
        <text x="52" y="42" fill="#5e5a55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">feature-ready showcase</text>
      </g>

      <g transform="translate(24,192)">
        <rect x="0" y="0" width="222" height="56" rx="18" fill="#ffffff" stroke="#111111" stroke-opacity="0.10" />
        <circle cx="28" cy="28" r="10" fill="#ffd84d" />
        <text x="52" y="24" fill="#111111" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Recent signal</text>
        <text x="52" y="42" fill="#5e5a55" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">public work with value</text>
      </g>
    </g>

    <g transform="translate(190,412)" opacity="0.94">
      <path d="M0 0 C100 -24, 198 -24, 298 0 S496 24, 596 0 S794 -24, 894 0 S1092 24, 1192 0 S1390 -24, 1490 0" fill="none" stroke="#111111" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round">
        <animate attributeName="d" values="M0 0 C100 -24, 198 -24, 298 0 S496 24, 596 0 S794 -24, 894 0 S1092 24, 1192 0 S1390 -24, 1490 0;M0 0 C100 24, 198 24, 298 0 S496 -24, 596 0 S794 24, 894 0 S1092 -24, 1192 0 S1390 24, 1490 0;M0 0 C100 -24, 198 -24, 298 0 S496 24, 596 0 S794 -24, 894 0 S1092 24, 1192 0 S1390 -24, 1490 0" dur="8s" repeatCount="indefinite" />
      </path>
    </g>

    <g transform="translate(1254,410)">
      <circle cx="0" cy="0" r="10" fill="#1ea896" />
      <circle cx="72" cy="0" r="7" fill="#ff7a45" />
      <circle cx="144" cy="0" r="8" fill="#ffd84d" />
      <circle cx="216" cy="0" r="6" fill="#111111" />
      <path d="M0 0 H216" stroke="#111111" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="8 10" />
    </g>
  </g>
</svg>
